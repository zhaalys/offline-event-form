<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D Comic Forest with Interactive Attendees</title>

  <link rel="stylesheet" href="style.css">

  <!-- Three.js dimuat secara dinamis oleh script.js dengan multi-CDN fallback -->
  <script src="script.js" defer></script>
</head>

<body>

  <div id="canvas-container"></div>

  <div id="forest-status" class="status hidden">Loading 3D engine...</div>

  <div class="toolbar">

    <div class="counter">
      Pesan masuk:
      <span id="attendee-count">0</span>
    </div>

    <button id="refresh-btn" title="Muat ulang pesan dari Google Sheet">
      Refresh
    </button>

  </div>

  <div class="hint">Drag untuk melihat &middot; Scroll untuk zoom</div>

</body>
</html>
